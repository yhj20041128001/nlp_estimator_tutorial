# ============================================================
# MySQL / TiDB 数据库账号安全监控配置
# ============================================================

monitor:
  poll_interval: 30
  log_file: account_monitor.log
  state_file: account_monitor_state.json
  high_risk_users:
    - dba_root
    - root
  dormant_thresholds_days:
    - 1
    - 7
    - 30

telegram:
  enabled: true
  token: "xxxx"
  chat_id: "-xxxx"

proxy:
  enabled: false
  http: "http:/xxxx:xxx"
  https: "http://xxxx:xxx"

databases:

  - note: "xxxxx测试环境"
    tenant: "xxx部门"
    dbProject: "xxx"
    dbType: "mysql xxxx"
    hostname: "xxxxxx"
    host: "xxxxxxx"
    port: 3306
    username: "dba_monitor_xxxx"
    password: "xxxxxxxx"
